[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[project]
name = "sisfin"
version = "1.1.0"
description = "ERP financeiro familiar com razão contábil e API assíncrona"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.142,<0.143", "uvicorn>=0.54,<0.55", "pydantic>=2.13,<3",
  "pydantic-settings>=2.15,<3", "sqlalchemy[asyncio]>=2.0.54,<2.1",
  "asyncpg>=0.31,<0.32", "alembic>=1.20,<2", "PyJWT>=2.15,<3",
  "bcrypt>=5,<6", "python-multipart>=0.0.32,<0.1", "email-validator>=2.3,<3"
]

[project.optional-dependencies]
test = ["pytest>=9,<10", "pytest-asyncio>=1.4,<2", "httpx>=0.28,<0.29", "ruff>=0.16,<0.17"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
pythonpath = ["."]
testpaths = ["tests"]
markers = ["integration: requer PostgreSQL 16 real e TEST_DATABASE_URL"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
